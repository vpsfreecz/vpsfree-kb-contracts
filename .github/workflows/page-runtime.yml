name: Managed page runtime

on:
  push:
    paths:
      - .github/workflows/page-runtime.yml
      - captures.json
      - cluster/**
      - contract/pages.yml
      - contract/pages/**
      - flake.lock
      - flake.nix
      - test-runner.sh
      - tests/**
      - tools/check-page-contract.rb
      - tools/check-managed-page-sources.rb
      - tools/test-page-contract.rb
      - tools/test-managed-page-sources.rb
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 0"

permissions:
  contents: read

jobs:
  test:
    name: Run integration test suite
    runs-on: self-hosted
    if: github.event_name != 'push' || github.event.deleted != true
    timeout-minutes: 480

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check repository
        run: nix develop --command bin/check --allow-missing

      - name: Prepare test state
        id: prepare-tests
        uses: vpsfreecz/vpsadminos/.github/actions/prepare-test-state@6bdf458fd9105379860234ff33d352e55844f08f

      - name: Run tests
        id: run-tests
        timeout-minutes: 420
        run: |
          set -o pipefail
          ./test-runner.sh test \
            --state-dir "$TEST_RUNNER_STATE_DIR" \
            --fresh \
            --jobs auto \
            | tee "$TEST_RUNNER_STATE_DIR/test.log"

      - name: Upload full test logs
        id: upload-test-logs
        if: >-
          (failure() || cancelled()) &&
          steps.prepare-tests.outcome == 'success' &&
          steps.run-tests.outcome != 'skipped'
        uses: vpsfreecz/vpsadminos/.github/actions/upload-test-logs@6bdf458fd9105379860234ff33d352e55844f08f
        with:
          name: kb-test-logs-${{ github.run_id }}
          paths: |
            ${{ steps.prepare-tests.outputs.state-directory }}/**/*.log
            ${{ steps.prepare-tests.outputs.state-directory }}/**/*.txt

      - name: Evaluate test results
        if: >-
          always() &&
          steps.prepare-tests.outcome == 'success' &&
          steps.run-tests.outcome != 'skipped'
        uses: vpsfreecz/vpsadminos/.github/actions/evaluate-test-results@6bdf458fd9105379860234ff33d352e55844f08f
        with:
          log-file: ${{ steps.prepare-tests.outputs.state-directory }}/test.log

      - name: Summarise test logs
        if: >-
          always() &&
          steps.prepare-tests.outcome == 'success' &&
          steps.run-tests.outcome != 'skipped'
        uses: vpsfreecz/vpsadminos/.github/actions/summarise-test-logs@6bdf458fd9105379860234ff33d352e55844f08f
        with:
          logs-root: ${{ steps.prepare-tests.outputs.state-directory }}

      - name: Cleanup test state
        if: always()
        uses: vpsfreecz/vpsadminos/.github/actions/cleanup-test-state@6bdf458fd9105379860234ff33d352e55844f08f
        with:
          state-directory: ${{ steps.prepare-tests.outputs.state-directory }}
          prepare-outcome: ${{ steps.prepare-tests.outcome }}
          test-outcome: ${{ steps.run-tests.outcome }}
          upload-outcome: ${{ steps.upload-test-logs.outcome }}
