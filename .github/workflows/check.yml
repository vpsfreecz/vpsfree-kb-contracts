name: Check

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      strict:
        description: Check the full committed screenshot inventory
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install upstream Nix
        # Retain v22 so source and strict runs share the existing installer setup;
        # qualify installer upgrades separately from this media-mode change.
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: false

      - name: Run strict repository checks
        if: github.event_name == 'workflow_dispatch' && inputs.strict == true
        run: nix develop --command bin/check

      - name: Run source repository checks
        if: github.event_name != 'workflow_dispatch' || inputs.strict != true
        run: nix develop --command bin/check --allow-missing
