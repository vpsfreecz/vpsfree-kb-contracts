name: Check

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install upstream Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: false

      - name: Run repository checks
        run: nix develop --command bin/check --allow-missing
