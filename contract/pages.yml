            comments:
              4: '# Install the command-line tools and boot-time persistence.'
              8: '# Keep traffic allowed while replacing the current rules.'
              16: '# Remove the current filter rules and user-defined chains.'
              22: '# IPv4 input: drop invalid packets, keep established traffic, and open services.'
              29: '# IPv6 input: apply the same policy and keep IPv6 control traffic working.'
              36: '# Drop other input and forwarded traffic; keep locally generated output allowed.'
              42: '# Persist the rules and display the resulting input policy.'
        tests:
        - iptables
