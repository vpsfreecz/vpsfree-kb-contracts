              19: '    # Tento jednoduchý firewall nepředává žádný provoz.'
              24: '    # Povol veškerý provoz vytvořený na VPS.'
          en:
            comments:
              3: '# Replace the complete current ruleset.'
              10: '    # Handle state first, trust loopback, keep control traffic, and open services.'
